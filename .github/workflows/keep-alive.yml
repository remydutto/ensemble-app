name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 8 * * *'      # tous les jours à 8h UTC
  workflow_dispatch:         # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write            # nécessaire pour que le workflow puisse committer

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      # L'URL et la clé "anon" sont publiques (déjà exposées dans js/config.js).
      SUPABASE_URL: https://wjuzffsdmytluztgegcg.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqdXpmZnNkbXl0bHV6dGdlZ2NnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDY4MjUsImV4cCI6MjEwMjc4MjgyNX0.mxJtxD_bzFRTsg2ZFjqy64vJ3J34Q4_-YGNWmd-ZRCg
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Ping Supabase (lecture)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/couples?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Statut lecture : $code"
          if [ "$code" != "200" ]; then
            echo "::error::Lecture Supabase en échec (HTTP $code)"
            exit 1
          fi

      - name: Ping Supabase (écriture dans la table heartbeat)
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping_heartbeat" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Statut écriture : $code"
          echo "Réponse : $body"
          if [ "$code" != "200" ]; then
            echo "::error::Écriture Supabase en échec (HTTP $code)"
            exit 1
          fi

      # Un commit par semaine suffit : le lundi, ou lors d'un lancement manuel.
      - name: Enregistrer un repère (empêche la désactivation du workflow après 60 jours d'inactivité du dépôt)
        run: |
          if [ "$(date -u +%u)" != "1" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Pas de repère aujourd'hui (seulement le lundi)."
            exit 0
          fi
          git config user.name "keep-alive-bot"
          git config user.email "actions@github.com"
          echo "Dernier ping : $(date -u)" > .github/last-ping.txt
          git add .github/last-ping.txt
          git commit -m "chore: ping automatique (garde Supabase et ce workflow actifs)"
          git push
